<title>Job Scout Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #fff; --fg: #1a1a1a; --muted: #666; --border: #e0e0e0;
    --card: #f8f8f8; --accent: #2563eb; --badge: #059669; --badge-fg: #fff;
    --score-high: #059669; --score-mid: #d97706; --score-low: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f0f; --fg: #e5e5e5; --muted: #999; --border: #2a2a2a;
      --card: #1a1a1a; --accent: #60a5fa; --badge: #10b981; --badge-fg: #000;
      --score-high: #34d399; --score-mid: #fbbf24; --score-low: #6b7280;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f0f; --fg: #e5e5e5; --muted: #999; --border: #2a2a2a;
    --card: #1a1a1a; --accent: #60a5fa; --badge: #10b981; --badge-fg: #000;
    --score-high: #34d399; --score-mid: #fbbf24; --score-low: #6b7280;
  }
  :root[data-theme="light"] {
    --bg: #fff; --fg: #1a1a1a; --muted: #666; --border: #e0e0e0;
    --card: #f8f8f8; --accent: #2563eb; --badge: #059669; --badge-fg: #fff;
    --score-high: #059669; --score-mid: #d97706; --score-low: #9ca3af;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); padding: 1rem; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
  .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 1rem; }
  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
  .filters select, .filters button { font-size: 0.8rem; padding: 0.3rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--fg); cursor: pointer; }
  .filters button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .jobs { display: flex; flex-direction: column; gap: 0.5rem; }
  .job { display: grid; grid-template-columns: 2.5rem 1fr; gap: 0.5rem; padding: 0.6rem 0.75rem; background: var(--card); border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: inherit; transition: border-color 0.15s; }
  .job:hover { border-color: var(--accent); }
  .score { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .score.high { color: var(--score-high); }
  .score.mid { color: var(--score-mid); }
  .score.low { color: var(--score-low); }
  .details { min-width: 0; }
  .title-row { display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap; }
  .job-title { font-weight: 600; font-size: 0.9rem; }
  .company { color: var(--muted); font-size: 0.85rem; }
  .badge { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 0.1rem 0.35rem; border-radius: 3px; background: var(--badge); color: var(--badge-fg); vertical-align: middle; margin-left: 0.25rem; }
  .info-row { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .rationale { font-size: 0.8rem; margin-top: 0.2rem; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; }
  @media (max-width: 500px) {
    .job { grid-template-columns: 2rem 1fr; padding: 0.5rem; }
    .score { font-size: 0.95rem; }
    .job-title { font-size: 0.85rem; }
  }
</style>

<h1>Job Scout Dashboard</h1>
<div class="meta" id="meta">Loading...</div>

<div class="filters" id="filters">
  <select id="source-filter"><option value="">All sources</option></select>
  <select id="score-filter">
    <option value="0">Any score</option>
    <option value="6">6+</option>
    <option value="7">7+</option>
    <option value="8" selected>8+</option>
    <option value="9">9+</option>
  </select>
  <select id="sort-by">
    <option value="score">Score</option>
    <option value="date">Date</option>
  </select>
  <button id="new-only">New only</button>
</div>

<div class="jobs" id="jobs"></div>

<script>
(async () => {
  const LAST_VISIT_KEY = 'jobscout_last_visit';
  const lastVisit = localStorage.getItem(LAST_VISIT_KEY);
  const now = new Date().toISOString();

  let jobs = [];
  try {
    const r = await fetch('jobs.json');
    jobs = await r.json();
  } catch (e) {
    document.getElementById('jobs').innerHTML = '<div class="empty">Could not load jobs.json</div>';
    return;
  }

  jobs.forEach(j => { j._new = lastVisit ? j.date > lastVisit.slice(0, 10) : false; });

  const sources = [...new Set(jobs.map(j => j.source).filter(Boolean))].sort();
  const sf = document.getElementById('source-filter');
  sources.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sf.appendChild(o); });

  let newOnlyActive = false;
  const newBtn = document.getElementById('new-only');
  newBtn.addEventListener('click', () => { newOnlyActive = !newOnlyActive; newBtn.classList.toggle('active', newOnlyActive); render(); });

  const scoreFilter = document.getElementById('score-filter');
  const sortBy = document.getElementById('sort-by');
  sf.addEventListener('change', render);
  scoreFilter.addEventListener('change', render);
  sortBy.addEventListener('change', render);

  function render() {
    const minScore = parseInt(scoreFilter.value);
    const srcVal = sf.value;
    const sort = sortBy.value;

    let filtered = jobs.filter(j => j.score >= minScore);
    if (srcVal) filtered = filtered.filter(j => j.source === srcVal);
    if (newOnlyActive) filtered = filtered.filter(j => j._new);

    if (sort === 'score') filtered.sort((a, b) => b.score - a.score || b.date.localeCompare(a.date));
    else filtered.sort((a, b) => b.date.localeCompare(a.date) || b.score - a.score);

    const newCount = jobs.filter(j => j._new).length;
    const latest = jobs.reduce((m, j) => j.date > m ? j.date : m, '');
    document.getElementById('meta').textContent =
      `${jobs.length} jobs tracked` +
      (newCount ? ` · ${newCount} new` : '') +
      (latest ? ` · last updated ${latest}` : '');

    const container = document.getElementById('jobs');
    if (!filtered.length) {
      container.innerHTML = '<div class="empty">No jobs match the current filters</div>';
      return;
    }

    container.innerHTML = filtered.map(j => {
      const sc = j.score >= 8 ? 'high' : j.score >= 6 ? 'mid' : 'low';
      const badge = j._new ? '<span class="badge">NEW</span>' : '';
      const company = j.company ? `<span class="company">${esc(j.company)}</span>` : '';
      const tier = j.tier ? `tier ${j.tier}` : '';
      return `<a class="job" href="${esc(j.link)}" target="_blank" rel="noopener">
        <div class="score ${sc}">${j.score}</div>
        <div class="details">
          <div class="title-row"><span class="job-title">${esc(j.title)}</span>${company}${badge}</div>
          <div class="info-row"><span>${esc(j.source)}</span><span>${j.date}</span>${tier ? `<span>${tier}</span>` : ''}</div>
          ${j.rationale ? `<div class="rationale">${esc(j.rationale)}</div>` : ''}
        </div>
      </a>`;
    }).join('');
  }

  function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  render();
  localStorage.setItem(LAST_VISIT_KEY, now);
})();
</script>
